# =============================================================================
# nginx.conf — reverse proxy for hr-platform-frontend (Next.js)
#
# No Docker — PM2 runs the Next.js server directly on the VPS.
#
#   Internet (443)
#       → nginx (SSL termination via Certbot)
#           → Next.js server (localhost:6001, bound to loopback only)
#
# Deploy path  : /var/www/hr-platform/frontend
# PM2 app name : hr-frontend
# Build cmd    : npm run build  (inside frontend/)
# Start cmd    : npm start      (next start -p 6001)
# =============================================================================

# ── Upgrade map (Next.js HMR uses WebSockets; also future-proofs the stack) ──
map $http_upgrade $connection_upgrade {
    default  upgrade;
    ''       close;
}

upstream frontend {
    server localhost:6001;
    keepalive 32;
}

# =============================================================================
server {
    listen 80;

    server_name hr.bsrealtyllc.com;

    # ── Security headers ──────────────────────────────────────────────────────
    # X-Frame-Options is SAMEORIGIN (not DENY) so Next.js iframes work if needed.
    add_header X-Content-Type-Options  "nosniff"                          always;
    add_header X-Frame-Options         "SAMEORIGIN"                       always;
    add_header X-XSS-Protection        "1; mode=block"                    always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin"  always;

    # ── Next.js static assets (content-hashed filenames → immutable cache) ────
    # These are fingerprinted at build time — safe to cache for a full year.
    location /_next/static/ {
        proxy_pass          http://frontend;
        proxy_http_version  1.1;
        proxy_set_header    Host $host;

        expires             1y;
        add_header          Cache-Control "public, immutable";
        access_log          off;
    }

    # ── Public folder (favicon, robots.txt, og-images, etc.) ─────────────────
    location /public/ {
        proxy_pass          http://frontend;
        proxy_http_version  1.1;
        proxy_set_header    Host $host;

        expires             1d;
        add_header          Cache-Control "public, must-revalidate";
    }

    # ── Next.js image optimisation endpoint ───────────────────────────────────
    # First request can be slow — give it a generous read timeout.
    location /_next/image {
        proxy_pass          http://frontend;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;

        proxy_read_timeout  60s;
    }

    # ── All other requests (pages, RSC payloads, API rewrites to backend) ─────
    location / {
        proxy_pass            http://frontend;
        proxy_http_version    1.1;

        # Needed for Next.js HMR WebSocket during development builds.
        proxy_set_header      Upgrade           $http_upgrade;
        proxy_set_header      Connection        $connection_upgrade;

        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_cache_bypass    $http_upgrade;

        proxy_read_timeout    60s;
        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
    }
}
