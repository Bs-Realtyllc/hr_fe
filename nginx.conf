# =============================================================================
# nginx.conf — single reverse proxy for hr.gitgi.com (frontend + backend)
#
# Frontend and backend both run on this same VPS, so ONE nginx server block
# must own `server_name hr.gitgi.com` and split traffic by path. (Previously
# frontend/nginx.conf and backend/nginx.conf each declared their own
# `server_name hr.bsrealtyllc.com` block — only one of those can ever win on
# a given host/port, which is why /api/* requests were not reliably reaching
# the backend. backend/nginx.conf has been retired — see the note left there.)
#
#   Internet (443, TLS via Certbot)
#       → nginx
#           ├── /api/*  → hr-be-backend  (localhost:6002)
#           └── everything else → hr-fe-frontend (localhost:6001)
#
# Deploy: install this as the *only* server block for hr.gitgi.com, e.g.
#   /etc/nginx/sites-available/hr.gitgi.com  (symlinked into sites-enabled)
# Then run `certbot --nginx -d hr.gitgi.com` to add the 443/TLS block.
# =============================================================================

# ── Upgrade map (Next.js HMR uses WebSockets; also future-proofs the stack) ──
map $http_upgrade $connection_upgrade {
    default  upgrade;
    ''       close;
}

upstream frontend {
    server localhost:6001;
    keepalive 32;
}

upstream backend {
    server localhost:6002;
    keepalive 64;
}

# =============================================================================
server {
    listen 80;

    server_name hr.gitgi.com;

    # ── Security headers ──────────────────────────────────────────────────────
    # X-Frame-Options is SAMEORIGIN (not DENY) so Next.js iframes work if needed.
    add_header X-Content-Type-Options  "nosniff"                          always;
    add_header X-Frame-Options         "SAMEORIGIN"                       always;
    add_header X-XSS-Protection        "1; mode=block"                    always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin"  always;

    # ── Request size ──────────────────────────────────────────────────────────
    # Raise further if you later add file/avatar upload endpoints.
    client_max_body_size 10m;

    # ── Backend: health check ───────────────────────────────────────────────
    # Suppress access logs so monitoring pings don't pollute the log stream.
    location = /api/health {
        access_log off;
        proxy_pass        http://backend;
        proxy_set_header  Host       $host;
        proxy_set_header  X-Real-IP  $remote_addr;
    }

    # ── Backend: Swagger UI ──────────────────────────────────────────────────
    # The UI loads several JS/CSS bundles on first open; give it extra time.
    # In production you may want to restrict this path to VPN/internal IPs only.
    location /api/swagger/ {
        proxy_pass            http://backend;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;

        proxy_read_timeout    60s;
        proxy_connect_timeout 30s;
    }

    # ── Backend: all /api/* routes ───────────────────────────────────────────
    # Allow slow DB queries (e.g. heavy reports) and future file uploads.
    location /api/ {
        proxy_pass            http://backend;
        proxy_http_version    1.1;

        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;

        proxy_read_timeout    300s;
        proxy_connect_timeout  75s;
        proxy_send_timeout    300s;
    }

    # ── Frontend: Next.js static assets (content-hashed → immutable cache) ────
    # These are fingerprinted at build time — safe to cache for a full year.
    location /_next/static/ {
        proxy_pass          http://frontend;
        proxy_http_version  1.1;
        proxy_set_header    Host $host;

        expires             1y;
        add_header          Cache-Control "public, immutable";
        access_log          off;
    }

    # ── Frontend: public folder (favicon, robots.txt, og-images, etc.) ────────
    location /public/ {
        proxy_pass          http://frontend;
        proxy_http_version  1.1;
        proxy_set_header    Host $host;

        expires             1d;
        add_header          Cache-Control "public, must-revalidate";
    }

    # ── Frontend: Next.js image optimisation endpoint ─────────────────────────
    # First request can be slow — give it a generous read timeout.
    location /_next/image {
        proxy_pass          http://frontend;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;

        proxy_read_timeout  60s;
    }

    # ── Frontend: everything else (pages, RSC payloads) ───────────────────────
    location / {
        proxy_pass            http://frontend;
        proxy_http_version    1.1;

        # Needed for Next.js HMR WebSocket during development builds.
        proxy_set_header      Upgrade           $http_upgrade;
        proxy_set_header      Connection        $connection_upgrade;

        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_cache_bypass    $http_upgrade;

        proxy_read_timeout    60s;
        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
    }
}
